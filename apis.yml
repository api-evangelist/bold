aid: bold
name: Bold
description: >-
  Bold (Age Bold, Inc.) is an AI-enabled healthy-aging company founded in 2019 by Amanda Rees and
  Hari Arul that combines age-friendly virtual care with senior-focused exercise and nutrition
  programs for Medicare members. The platform delivers personalized at-home programs — live and
  on-demand classes, balance and fall-prevention regimens, pain and mobility programs, nutrition
  coaching, and telehealth visits with clinicians — to adults 65 and older, distributed through
  Medicare Advantage plans, provider groups, and the CMS ACCESS program rather than sold as a
  developer platform. Bold reports its balance programs lower fall risk and its pain programs reduce
  joint pain among participating members, and states its platform is HIPAA compliant and requires no
  lengthy IT integration for plan partners. The company has raised roughly $27M, with a $17M Series A
  led by Rethink Impact alongside Andreessen Horowitz Bio + Health, Khosla Ventures, Samsung Next,
  GingerBread Capital, and Primetime Partners. As of this enrichment pass Bold publishes no public
  developer portal, API documentation, OpenAPI definition, SDKs, or partner API surface — integrations
  are handled through its partnerships team.
